<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Emani Franc Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<style>
:root{--black:#0a0a0a;--black-2:#141414;--black-3:#1c1c1c;--gold:#d4af37;--gold-light:#f0d57a;--white:#ffffff;--gray:#8a8a8a;--red:#ef4444;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--white);line-height:1.6}
a{text-decoration:none;color:inherit}

.admin-layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--black-2);border-right:1px solid rgba(255,255,255,.05);padding:2rem 1.5rem;position:fixed;height:100vh}
.sidebar-logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:3rem;display:flex;align-items:center;gap:.5rem}
.sidebar-logo span{color:var(--white);font-weight:400}
.sidebar-menu a{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:8px;color:var(--gray);transition:all .3s ease;margin-bottom:.5rem}
.sidebar-menu a:hover, .sidebar-menu a.active{background:rgba(212,175,55,.1);color:var(--gold)}
.sidebar-menu a i{width:20px;text-align:center}

.main-content{flex:1;margin-left:260px;padding:2rem 3rem}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.05)}
.header h1{font-family:'Playfair Display',serif;font-size:1.8rem}
.btn{padding:.7rem 1.5rem;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s ease;border:none;display:inline-flex;align-items:center;gap:.5rem}
.btn-primary{background:var(--gold);color:var(--black)}
.btn-primary:hover{background:var(--gold-light)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--red)}
.btn-danger:hover{background:var(--red);color:var(--white)}
.btn-sm{padding:.4rem .8rem;font-size:.75rem}

.alert{padding:1rem 1.5rem;border-radius:8px;margin-bottom:2rem;display:flex;align-items:center;gap:.8rem}
.alert-success{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.alert-error{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}

.table-container{background:var(--black-2);border-radius:12px;border:1px solid rgba(255,255,255,.05);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:1.2rem 1.5rem;background:rgba(255,255,255,.02);color:var(--gray);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
td{padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,.05);vertical-align:middle}
.product-info{display:flex;align-items:center;gap:1rem}
.product-info img{width:50px;height:50px;border-radius:6px;object-fit:cover;background:var(--black-3)}
.badge-tag{padding:.3rem .7rem;border-radius:50px;font-size:.7rem;font-weight:600}
.badge-new{background:var(--white);color:var(--black)}
.badge-promo{background:var(--gold);color:var(--black)}
.actions{display:flex;gap:.5rem}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--black-2);border:1px solid rgba(212,175,55,.2);border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:2rem}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.modal-header h2{font-family:'Playfair Display',serif;font-size:1.5rem}
.close-modal{background:none;border:none;color:var(--gray);font-size:1.2rem;cursor:pointer}
.close-modal:hover{color:var(--white)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{margin-bottom:1rem}
.form-group.full{grid-column:1/-1}
.form-group label{display:block;font-size:.8rem;color:var(--gray);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.05em}
.form-group input, .form-group select, .form-group textarea{width:100%;padding:.8rem 1rem;background:var(--black-3);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--white);font-family:inherit;font-size:.9rem;transition:border-color .3s}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none;border-color:var(--gold)}
.form-group textarea{resize:vertical;min-height:80px}

.loading{text-align:center;padding:3rem;color:var(--gray)}
.loading i{font-size:2rem;color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:968px){
  .sidebar{display:none}
  .main-content{margin-left:0;padding:1.5rem}
  .table-container{overflow-x:auto}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><span>FRANC</span> EMANI</div>
    <nav class="sidebar-menu">
      <a href="#" class="active"><i class="fas fa-box"></i> Produits</a>
      <a href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Voir le site</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="header">
      <h1>Gestion des Chaussures</h1>
      <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Ajouter un produit</button>
    </div>

    <div id="alertContainer"></div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Produit</th>
            <th>Catégorie</th>
            <th>Prix</th>
            <th>Badge</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsTable">
          <tr><td colspan="5" class="loading"><i class="fas fa-spinner"></i><p style="margin-top:1rem">Chargement...</p></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Nouveau produit</h2>
      <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    
    <form id="productForm">
      <input type="hidden" id="productId">
      
      <div class="form-grid">
        <div class="form-group full">
          <label>Nom du produit</label>
          <input type="text" id="name" required placeholder="Ex: Oxford Classic">
        </div>
        
        <div class="form-group">
          <label>Marque / Collection</label>
          <input type="text" id="brand" required placeholder="Ex: Collection Heritage">
        </div>
        
        <div class="form-group">
          <label>Catégorie</label>
          <select id="category" required>
            <option value="classique">Classique</option>
            <option value="sport">Sport</option>
            <option value="boot">Boot</option>
            <option value="limited">Édition limitée</option>
          </select>
        </div>

        <div class="form-group">
          <label>Prix (FCFA)</label>
          <input type="number" id="price" required placeholder="Ex: 25000">
        </div>

        <div class="form-group">
          <label>Ancien prix (optionnel)</label>
          <input type="number" id="old_price" placeholder="Ex: 30000">
        </div>

        <div class="form-group">
          <label>Badge (optionnel)</label>
          <input type="text" id="badge" placeholder="Ex: Nouveau, -20%">
        </div>

        <div class="form-group">
          <label>Classe du badge</label>
          <select id="badge_class">
            <option value="">Aucune</option>
            <option value="new">Nouveau (Blanc)</option>
            <option value="promo">Promo (Or)</option>
          </select>
        </div>

        <div class="form-group full">
          <label>URL de l'image</label>
          <input type="url" id="image" required placeholder="https://...">
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea id="description" required placeholder="Description du produit..."></textarea>
        </div>

        <div class="form-group full">
          <label>Tailles (séparées par des virgules)</label>
          <input type="text" id="sizes" value="39,40,41,42,43,44" placeholder="39,40,41,42,43,44">
        </div>
      </div>

      <div style="display:flex;gap:1rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center">
          <i class="fas fa-save"></i> <span id="submitText">Enregistrer</span>
        </button>
        <button type="button" class="btn" style="background:var(--black-3);color:var(--white);flex:1;justify-content:center" onclick="closeModal()">Annuler</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ️ REMPLACE CES VALEURS PAR LES TIENNES (depuis Supabase > Settings > API)
const SUPABASE_URL = 'https://TON_PROJET.supabase.co';
const SUPABASE_KEY = 'TA_CLE_ANON_PUBLIQUE';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Charger les produits
async function loadProducts() {
  const tbody = document.getElementById('productsTable');
  tbody.innerHTML = '<tr><td colspan="5" class="loading"><i class="fas fa-spinner"></i><p style="margin-top:1rem">Chargement...</p></td></tr>';
  
  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('id', { ascending: false });
  
  if (error) {
    showAlert('Erreur: ' + error.message, 'error');
    return;
  }
  
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--gray)">Aucun produit. Ajoute-en un !</td></tr>';
    return;
  }
  
  tbody.innerHTML = data.map(p => `
    <tr>
      <td>
        <div class="product-info">
          <img src="${p.image}" alt="${p.name}">
          <div>
            <div style="font-weight:600">${p.name}</div>
            <div style="font-size:.8rem;color:var(--gray)">${p.brand}</div>
          </div>
        </div>
      </td>
      <td><span style="text-transform:capitalize">${p.category}</span></td>
      <td>
        <div style="color:var(--gold);font-weight:600">${p.price.toLocaleString('fr-FR')} FCFA</div>
        ${p.old_price ? `<div style="font-size:.8rem;color:var(--gray);text-decoration:line-through">${p.old_price.toLocaleString('fr-FR')} FCFA</div>` : ''}
      </td>
      <td>
        ${p.badge ? `<span class="badge-tag ${p.badge_class === 'new' ? 'badge-new' : 'badge-promo'}">${p.badge}</span>` : '<span style="color:var(--gray)">-</span>'}
      </td>
      <td>
        <div class="actions">
          <button class="btn btn-sm btn-primary" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join('');
}

// Ajouter / Modifier
document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const id = document.getElementById('productId').value;
  const product = {
    name: document.getElementById('name').value,
    brand: document.getElementById('brand').value,
    price: parseInt(document.getElementById('price').value),
    old_price: document.getElementById('old_price').value ? parseInt(document.getElementById('old_price').value) : null,
    category: document.getElementById('category').value,
    badge: document.getElementById('badge').value || null,
    badge_class: document.getElementById('badge_class').value || null,
    image: document.getElementById('image').value,
    description: document.getElementById('description').value,
    sizes: document.getElementById('sizes').value.split(',').map(s => s.trim())
  };
  
  let error;
  if (id) {
    const res = await supabase.from('products').update(product).eq('id', id);
    error = res.error;
  } else {
    const res = await supabase.from('products').insert([product]);
    error = res.error;
  }
  
  if (error) {
    showAlert('Erreur: ' + error.message, 'error');
  } else {
    showAlert(id ? 'Produit modifié !' : 'Produit ajouté !', 'success');
    closeModal();
    loadProducts();
  }
});

// Modifier
async function editProduct(id) {
  const { data, error } = await supabase.from('products').select('*').eq('id', id).single();
  if (error) return showAlert('Erreur', 'error');
  
  document.getElementById('productId').value = data.id;
  document.getElementById('name').value = data.name;
  document.getElementById('brand').value = data.brand;
  document.getElementById('price').value = data.price;
  document.getElementById('old_price').value = data.old_price || '';
  document.getElementById('category').value = data.category;
  document.getElementById('badge').value = data.badge || '';
  document.getElementById('badge_class').value = data.badge_class || '';
  document.getElementById('image').value = data.image;
  document.getElementById('description').value = data.description;
  document.getElementById('sizes').value = data.sizes.join(',');
  
  document.getElementById('modalTitle').textContent = 'Modifier le produit';
  document.getElementById('submitText').textContent = 'Mettre à jour';
  document.getElementById('productModal').classList.add('active');
}

// Supprimer
async function deleteProduct(id) {
  if (!confirm('Supprimer ce produit ?')) return;
  
  const { error } = await supabase.from('products').delete().eq('id', id);
  if (error) {
    showAlert('Erreur: ' + error.message, 'error');
  } else {
    showAlert('Produit supprimé !', 'success');
    loadProducts();
  }
}

// Modal
function openModal() {
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('modalTitle').textContent = 'Nouveau produit';
  document.getElementById('submitText').textContent = 'Enregistrer';
  document.getElementById('productModal').classList.add('active');
}

function closeModal() {
  document.getElementById('productModal').classList.remove('active');
}

function showAlert(msg, type) {
  const container = document.getElementById('alertContainer');
  container.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>${msg}</div>`;
  setTimeout(() => container.innerHTML = '', 3000);
}

// Charger au démarrage
loadProducts();
</script>

</body>
</html>
